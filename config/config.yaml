# All paths are relative to the project root.
# Column names are the cleaned snake_case names (renaming happens first in ingest.py).

paths:
  raw_data: data/raw/Telco_customer_churn.xlsx
  processed_data: data/processed/churn.parquet
  train_data: data/processed/train.parquet
  test_data: data/processed/test.parquet
  scoring_input: data/processed/churn.parquet   # demo: score every known customer
  scored_dir: data/scored
  model: models/churn_model.pkl

target_col: churn_value

# Kept for joining/tracking, never used as a feature
id_cols:
  - customer_id

# Columns to drop, grouped by reason
drop_cols:
  # single value for every row
  constant:
    - count
    - country
    - state
  # leak the label: known only after churn, or derived from it
  leakage:
    - churn_label
    - churn_score
    - churn_reason
    - cltv
  # high cardinality / duplicates; revisit in feature engineering
  geo:
    - city
    - zip_code
    - lat_long
    - latitude
    - longitude

split:
  test_size: 0.2
  random_state: 42
  stratify: true

# Model inputs: only these columns are used as features
features:
  numeric:
    - tenure_months
    - monthly_charges
    - total_charges
    # engineered in src/features.py
    - is_new_customer
    - num_addon_services
    - has_auto_payment
    - has_family
    - avg_monthly_spend
    - charge_increase
  categorical:
    - gender
    - senior_citizen
    - partner
    - dependents
    - phone_service
    - multiple_lines
    - internet_service
    - online_security
    - online_backup
    - device_protection
    - tech_support
    - streaming_tv
    - streaming_movies
    - contract
    - paperless_billing
    - payment_method

cv:
  n_splits: 5

mlflow:
  experiment_name: churn-baseline

# class_weight="balanced" inflates probabilities; recalibrate on training data
calibration:
  method: sigmoid

# Retention campaign economics (assumptions from docs/problem_framing.md)
business:
  value_months: 12          # a saved customer stays this many more months
  email:
    cost: 1.0
    save_rate: 0.10         # share of contacted churners an email keeps
  call:
    cost: 50.0              # agent time + discount coupon
    save_rate: 0.30
  max_call_share: 0.03      # call team capacity: 3% of customers per campaign

reports_dir: reports
